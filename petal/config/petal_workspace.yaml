defaults:
  - _self_
  - task: wuji_head_rwrist

encoder_inputs: wuji_multirgb_joint

encoder_name: vit-small

name: ${task.dataset_name}_${encoder_name}
_target_: petal.workspace.petal_workspace.PetalWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: arrange_flowers

n_action_steps: 16
n_obs_steps: 1
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True

policy:
  _target_: petal.policy.petal_policy.PetalPolicy

  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: petal.model.vision.timm_obs_encoder_${encoder_inputs}.TimmObsEncoder
    shape_meta: ${shape_meta}
    model_name: ${oc.select:task.backbone_model_name,vit_small_r26_s32_224}
    use_augmentation: True
    crop_ratio: 0.95

  n_layer: 6
  n_head: 4
  p_drop_attn: 0.1
  use_attn_mask: False

ema:
  _target_: petal.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  lr: 1.0e-4
  weight_decay: 1e-4
  betas: [0.95, 0.999]

  start_ckpt_path: null
  start_normalizer_path: null


training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  num_epochs: 1000
  gradient_accumulate_every: 1
  use_ema: False
  checkpoint_every: 20
  val_every: 100
  sample_every: 20
  gen_attn_map: False
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: petaldex
  dir: ${oc.env:PROJECT_ROOT}/data
  resume: False
  mode: offline
  entity: null
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 50
    format_str: "epoch={epoch:04d}-train_loss={train_loss:.5f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
  sweep:
    dir: ${oc.env:PROJECT_ROOT}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
    subdir: ${hydra.job.num}
