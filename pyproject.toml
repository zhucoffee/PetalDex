[project]
name = "petaldex"
version = "0.1.0"
description = "Bimanual flower arrangement policy training and offline action prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "PetalDex contributors" }]
requires-python = "==3.9.23"
dependencies = [
    "accelerate==1.2.0",
    "colorama==0.4.6",
    "diffusers==0.36.0",
    "dill==0.3.9",
    "einops==0.8.1",
    "h5py==3.14.0",
    "huggingface-hub==0.34.4",
    "hydra-core==1.3.2",
    "gymnasium==1.1.1",
    "matplotlib==3.9.4",
    "numba==0.60.0",
    "numpy==1.26.0",
    "pandas==2.3.3",
    "opencv-python==4.11.0.86",
    "protobuf==6.33.4",
    "rich==14.2.0",
    "scipy==1.13.1",
    "sympy==1.14.0",
    "termcolor==3.1.0",
    "timm==1.0.12",
    "tqdm==4.67.1",
    "wandb==0.23.1",
    "zarr==2.12.0",
    "imagecodecs==2024.12.30",
    "psutil==7.2.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "rosbags==0.9.23",
    "numcodecs==0.12.1",
    "setuptools==80.9.0",
]

[project.urls]
Homepage = "https://petaldex.github.io/"
Repository = "https://github.com/zhucoffee/PetalDex"
Issues = "https://github.com/zhucoffee/PetalDex/issues"
Dataset = "https://huggingface.co/datasets/jasonGUself/PetalDex"

[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["psi_policy*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
